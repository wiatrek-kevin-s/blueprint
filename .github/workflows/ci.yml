# CI for Blueprint: runs on every pull request and every push to main.
# release.yml also calls it (workflow_call), so a release runs the same checks.
#
# The job is named "ci" so a ruleset on main can require it.
# It uses the pull_request event, never pull_request_target, so code from a
# fork never runs with the PRIVATE_TERMS secret; a fork's pull request runs
# without it and the private-terms step says it was skipped.
# Every step fails loudly; only the private-terms step may report skipped
# (when the PRIVATE_TERMS secret is not set).
# Actions are pinned to full commit hashes (actions/checkout v7.0.1, looked
# up 2026-11-05); review the pins every 6 months.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions: {}

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out (full history, pull request head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Skill checks and zip build (build-zip.sh)
        run: bash scripts/build-zip.sh

      - name: Task list template (check_tasks.py)
        run: python3 skill/scripts/check_tasks.py skill/templates/kit-tasks.json

      - name: Fixture kit that must pass (check_kit.py)
        run: python3 skill/scripts/check_kit.py evals/fixtures/kit-good

      - name: Fixture kit that must fail (check_kit.py)
        run: |
          if out=$(python3 skill/scripts/check_kit.py evals/fixtures/kit-missing-upkeep); then
            echo "$out"
            echo "FAIL: kit-missing-upkeep passed check_kit.py, but it must fail."
            exit 1
          fi
          echo "$out"
          if ! grep -q "Keeping it running" <<<"$out"; then
            echo "FAIL: kit-missing-upkeep failed check_kit.py, but not for the missing 'Keeping it running' section."
            exit 1
          fi
          echo "OK: kit-missing-upkeep failed check_kit.py for the missing 'Keeping it running' section, as it must."

      # Each check-* fixture's README.txt starts with its expectations, one per line:
      #   expect: <exit code> [--flag ...] [| text the output must contain]
      #   expect-tasks: <exit code> <tasks.json> [<baseline tasks.json>]   (paths inside the fixture)
      - name: Readiness-check fixtures (check-*, as each README.txt expects)
        run: |
          bad=0
          for dir in evals/fixtures/check-*/; do
            dir=${dir%/}
            n=0
            if [ ! -f "$dir/README.txt" ]; then echo "FAIL: $dir has no README.txt"; bad=1; continue; fi
            while IFS= read -r line; do
              case "$line" in
                "expect: "*)
                  spec=${line#expect: }; text=""
                  if [[ "$spec" == *" | "* ]]; then text=${spec#* | }; spec=${spec%% | *}; fi
                  read -r want flags <<<"$spec"
                  # shellcheck disable=SC2086
                  got=0; out=$(python3 skill/scripts/check_kit.py "$dir" $flags 2>&1) || got=$?
                  what="check_kit.py $dir $flags" ;;
                "expect-tasks: "*)
                  read -r want files <<<"${line#expect-tasks: }"; text=""
                  args=(); for f in $files; do args+=("$dir/$f"); done
                  got=0; out=$(python3 skill/scripts/check_tasks.py "${args[@]}" 2>&1) || got=$?
                  what="check_tasks.py ${args[*]}" ;;
                *) break ;;
              esac
              n=$((n + 1))
              if [ "$got" != "$want" ]; then
                echo "FAIL: $what exited $got, expected $want"; echo "$out"; bad=1
              elif [ -n "$text" ] && ! grep -qF -- "$text" <<<"$out"; then
                echo "FAIL: $what exited $got as expected, but its output lacks: $text"; echo "$out"; bad=1
              elif grep -q "Traceback" <<<"$out"; then
                echo "FAIL: $what crashed"; echo "$out"; bad=1
              else
                echo "OK: $what -> exit $got${text:+ (output has: $text)}"
              fi
            done < "$dir/README.txt"
            if [ "$n" = 0 ]; then echo "FAIL: $dir/README.txt has no 'expect:' line"; bad=1; fi
          done
          exit "$bad"

      - name: Route budget (route_budget.py)
        run: python3 scripts/route_budget.py

      - name: Private-terms check (tracked files and commit messages)
        env:
          PRIVATE_TERMS: ${{ secrets.PRIVATE_TERMS }}
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$PUSH_AFTER"
          else
            range="$PUSH_AFTER"  # new branch or unknown base: every commit up to the push
          fi
          echo "Commit messages checked: $range"
          python3 scripts/check_private.py --tracked --range "$range"
