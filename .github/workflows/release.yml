# Release for Blueprint.
#
# On a pushed tag such as v3.0.0 or v3.0.0-beta.1: run the same checks as CI
# (by calling ci.yml), build dist/blueprint.zip, check the tag against the
# newest CHANGELOG heading (scripts/check_version.py), and create a GitHub
# Release with the zip and that changelog entry. Tags with "-beta.N" become
# pre-releases.
#
# A release published by hand on GitHub's Releases page (with a new tag
# created on publish) also runs this workflow: the publish job then attaches
# the zip to that release and replaces its notes with the changelog entry, so
# a release can be made with a few clicks when pushing a tag is not possible.
#
# Manual run (Actions tab, "Run workflow"): a dry run. It runs the same checks,
# builds the zip and uploads it as a workflow artifact. It never creates a
# release or a tag. An optional tag input also tests check_version.py.
#
# Only the publish job may write to the repository (contents: write), and it
# runs only for a pushed tag. It uses the built-in GITHUB_TOKEN with the
# GitHub CLI; no other secret is needed.
# Actions are pinned to full commit hashes (actions/checkout v7.0.1;
# actions/upload-artifact v7.0.2, released 2026-10-07; looked up 2026-11-05);
# review the pins every 6 months.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and upload the zip only (manual runs are always dry runs)"
        type: boolean
        default: true
      tag:
        description: "Optional tag to test against CHANGELOG.md, such as v3.0.0-beta.1 (nothing is tagged)"
        type: string
        default: ""

permissions: {}

# A release published by hand creates its tag too, so both events can fire
# for one tag; run them one at a time. The publish step is safe to repeat.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  checks:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  dry-run:
    name: dry run
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Refuse to publish from a manual run
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" != "true" ]; then
            echo "FAIL: manual runs are dry runs only. To publish, push a tag such as v3.0.0-beta.1."
            exit 1
          fi
          echo "Dry run: no release or tag will be created."

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build dist/blueprint.zip (build-zip.sh)
        run: bash scripts/build-zip.sh

      - name: Test the tag against CHANGELOG.md (check_version.py)
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "SKIPPED: no tag given for this dry run."
            exit 0
          fi
          python3 scripts/check_version.py "$TAG" --notes-out "$RUNNER_TEMP/notes.md"
          echo "Release notes that would be used:"
          cat "$RUNNER_TEMP/notes.md"

      - name: Upload blueprint.zip as a workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blueprint.zip
          path: dist/blueprint.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'release'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build dist/blueprint.zip (build-zip.sh)
        run: bash scripts/build-zip.sh

      - name: Check the tag against CHANGELOG.md (check_version.py)
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/check_version.py "$TAG" --notes-out "$RUNNER_TEMP/notes.md"

      - name: Create the GitHub Release, or update one published by hand
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          extra=(--prerelease=false)
          case "$version" in
            *-beta.*) extra=(--prerelease) ;;
          esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/blueprint.zip --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "Blueprint $version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${extra[@]}"
          else
            gh release create "$TAG" dist/blueprint.zip \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Blueprint $version" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              "${extra[@]}"
          fi
